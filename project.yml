name: Hanjjok
options:
  bundleIdPrefix: kr.hurdlers
  deploymentTarget:
    macOS: "14.0"
packages:
  Domain:
    path: Packages/Domain
  Data:
    path: Packages/Data
  PanelKit:
    path: Packages/PanelKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  Hanjjok:
    type: application
    platform: macOS
    sources:
      - path: Hanjjok
    dependencies:
      - package: Domain
      - package: Data
      - package: PanelKit
      - package: KeyboardShortcuts
    info:
      path: Hanjjok/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: 한쪽
        NSHumanReadableCopyright: "© 2026 Joonhyuk Yoo"
        ATSApplicationFontsPath: .
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        SWIFT_VERSION: "5.10"
        CODE_SIGN_ENTITLEMENTS: Hanjjok/Hanjjok.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # 로컬 개발은 Apple ID 상태와 무관하게 항상 빌드되어야 한다 — ad-hoc 서명 + 샌드박스(검증됨)
        Debug:
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: false
        # App Store 아카이브 전용 — Xcode 계정 로그인이 유효해야 동작
        Release:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: B868S3249K
          ENABLE_HARDENED_RUNTIME: true
